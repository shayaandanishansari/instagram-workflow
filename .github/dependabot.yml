version: 2
updates:
  # Keep npm dependencies patched; open PRs automatically for advisories/updates.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Bundle dev-tooling bumps (vite/esbuild/etc.) into a single PR.
      dev-tooling:
        dependency-type: "development"

  # Keep the GitHub Actions we use (if any) up to date too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
